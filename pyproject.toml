[project]
name = "camera-wifi-autoimport"
version = "0.1.0"
description = "Import JPEGs from a camera Wi-Fi transfer folder into Immich"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
